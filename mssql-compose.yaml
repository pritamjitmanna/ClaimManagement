version: '3.8'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql
    user: root
    ports:
      - ${MSSQL_PORT}:1433
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_PASSWORD}  
    volumes:
      - mssqldb_data:/var/opt/mssql/data
      - mssqldb_log:/var/opt/mssql/log
      - mssqldb_secrets:/var/opt/mssql/secrets

volumes:
  mssqldb_data:
    external: true
  mssqldb_log:
    external: true
  mssqldb_secrets:
    external: true